[project]
name = "bot-commander"
version = "0.1.0"
description = "Reusable bot command framework with Telegram and XMPP adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
telegram = ["telegram-bot"]
xmpp = ["xmpp-bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_commander"]

[tool.uv.sources]
telegram-bot = { path = "../telegram-bot", editable = true }
xmpp-bot = { path = "../xmpp-bot", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
